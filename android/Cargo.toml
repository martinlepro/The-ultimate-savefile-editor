# Point d'entrée Android (NativeActivity) : un crate séparé pour que la compilation de bureau reste inchangée.
# Compilation : voir .github/workflows/build.yml  (cd android && cargo apk build --release --lib)
[package]
name = "savestudio-android"
version = "0.1.0"
edition = "2021"
description = "SaveStudio pour Android"

[lib]
name = "savestudio_android"
crate-type = ["cdylib"]

[dependencies]
savestudio = { path = ".." }
eframe = { version = "0.31", default-features = false, features = ["glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
log = "0.4"
android_logger = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.android]
package = "io.github.savestudio"
apk_name = "SaveStudio"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "SaveStudio"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"

# accès aux fichiers : « Tous les fichiers » (Réglages > Applications > SaveStudio > Autorisations) à activer à la main
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 32
