# Compile SaveStudio pour Linux, Windows et Android à chaque envoi sur GitHub.
#  - Téléchargement : onglet « Actions » > exécution > « Artifacts »
#  - Publication automatique : page « Releases » (pré-version « nightly » à chaque envoi sur la branche par défaut,
#    version « vX.Y.Z » quand on crée un tag v*)
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # nécessaire uniquement pour publier la release

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Tests
        if: matrix.name == 'linux-x86_64'
        run: cargo test --release

      - name: Compilation
        run: cargo build --release --target ${{ matrix.target }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/stage | Out-Null
          Copy-Item target/${{ matrix.target }}/release/savestudio.exe dist/stage/SaveStudio.exe
          Copy-Item README.md dist/stage/
          Compress-Archive -Path dist/stage/* -DestinationPath dist/SaveStudio-${{ matrix.name }}.zip
          Remove-Item -Recurse -Force dist/stage

      - name: Archive (Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/stage
          cp target/${{ matrix.target }}/release/savestudio dist/stage/SaveStudio
          cp README.md dist/stage/
          chmod +x dist/stage/SaveStudio
          tar -czf dist/SaveStudio-${{ matrix.name }}.tar.gz -C dist/stage .
          rm -rf dist/stage

      - uses: actions/upload-artifact@v4
        with:
          name: SaveStudio-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: android-arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android

      - name: SDK Android (plateforme 34 + build-tools)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: cargo-apk (en cache)
        id: apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-0.10.0-${{ runner.os }}

      - name: Installer cargo-apk
        if: steps.apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk --version 0.10.0 --locked

      # Clé de signature : celle de vos secrets si elle existe (mises à jour installables par-dessus),
      # sinon une clé jetable générée ici (l'APK s'installe, mais une mise à jour demandera de désinstaller l'ancienne).
      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            PASS="$KS_PASS"
          else
            PASS=android
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias savestudio \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SaveStudio"
          fi
          echo "CARGO_APK_RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Compilation de l'APK
        working-directory: android
        run: cargo apk build --release --lib

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp android/target/release/apk/SaveStudio.apk dist/SaveStudio-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SaveStudio-android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: publication
    needs: [desktop, android]
    # tourne même si une plateforme a échoué : on publie ce qui existe
    if: ${{ always() && github.event_name == 'push' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) && (needs.desktop.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Dernière version (nightly)' }}
          prerelease: ${{ github.ref_type != 'tag' }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: dist/*
